<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>미국 종목 상세 · 조기경보</title>
<script>
(function(){try{if(localStorage.getItem('dashboardTheme')==='dark')document.documentElement.dataset.theme='dark';}catch(e){}})();
</script>
<link rel="stylesheet" href="dashboard.css?v=4413b018b824f3b6810091a80c3afca49e2014ba">
</head><body>
<header><div class="header-inner"><div><a class="eyebrow" href="dashboard.html">← 미국 추천·검색</a><h1 id="title">종목 상세</h1></div><nav aria-label="상세 이동"><a href="../lgbm_warning_dashboard_macro_kr_latest/dashboard.html">한국 시장</a><a href="model.html">모델 설명·검증</a><a id="naver" target="_blank" rel="noopener" hidden>네이버 증권 ↗</a><button id="themeToggle" class="theme-toggle" aria-pressed="false" type="button">다크모드</button></nav></div></header>
<main><div class="workspace-title"><p id="stockMeta" class="muted"></p><label class="date-label">신호일<select id="date" aria-label="신호일"></select></label></div>
<p id="dataWarning" class="notice warning" hidden></p>
<div id="content" aria-live="polite">결과를 불러오는 중입니다.</div>
<section class="panel" id="historyPanel"><h2>저장된 예측 기록</h2><p class="muted">공개된 최근 신호일만 표시합니다. 기록이 없는 날의 예측을 새로 만들지 않습니다.</p><div id="history"></div></section>
</main><script src="common.js?v=4413b018b824f3b6810091a80c3afca49e2014ba"></script><script src="stock.js?v=4413b018b824f3b6810091a80c3afca49e2014ba"></script><script>
(function(){
  const button=document.getElementById('themeToggle');
  if(!button)return;
  function apply(theme){
    const dark=theme==='dark';
    document.documentElement.dataset.theme=dark?'dark':'';
    button.textContent=dark?'라이트모드':'다크모드';
    button.setAttribute('aria-pressed',String(dark));
    try{localStorage.setItem('dashboardTheme',dark?'dark':'light');}catch(e){}
  }
  button.addEventListener('click',()=>apply(document.documentElement.dataset.theme==='dark'?'light':'dark'));
  apply(document.documentElement.dataset.theme==='dark'?'dark':'light');
})();
</script>
</body></html>
