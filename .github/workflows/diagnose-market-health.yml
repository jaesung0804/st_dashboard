name: Diagnose market health
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect retained inputs or explicitly train an isolated relative-model research candidate
        type: choice
        options: [model, investment-inputs, relative-research]
        default: model
      market:
        type: choice
        options: [kr, us]
        default: kr
      month:
        description: Frozen model month YYYY-MM
        type: string
        default: '2026-09'
      artifact:
        description: Optional collection artifact ID (0 skips inspection)
        type: number
        default: 0
permissions:
  contents: read
  actions: read
concurrency:
  group: market-health-diagnosis
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RESEARCH_STORAGE: ${{ vars.RESEARCH_STORAGE }}
      RESEARCH_BACKEND_URL: ${{ vars.RESEARCH_BACKEND_URL }}
      RESEARCH_BACKEND_TOKEN: ${{ secrets.RESEARCH_BACKEND_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      DIAG_MARKET: ${{ inputs.market }}
      DIAG_MONTH: ${{ inputs.month }}
      DIAG_ARTIFACT: ${{ inputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-live.txt
      - name: Install production numerical packages
        run: python -m pip install -r requirements-live.txt
      - name: Reproduce frozen calibration and inspect optional collection artifact
        if: inputs.mode == 'model' || inputs.mode == ''
        run: python scripts/diagnose_market_health.py --market "$DIAG_MARKET" --month "$DIAG_MONTH" --artifact "$DIAG_ARTIFACT"
      - name: Inspect existing financial and FX input availability
        if: inputs.mode == 'investment-inputs'
        run: python scripts/inspect_investment_inputs.py
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'investment-inputs'
        with:
          name: investment-input-inventory
          path: .research-backend/artifacts/investment-input-inventory/report.json
      - name: Train and evaluate relative warnings in isolated research storage
        if: inputs.mode == 'relative-research'
        run: python scripts/run_relative_ews_research.py --root ".research-backend/artifacts/relative-ews-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --snapshot-name "relative-ews-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'relative-research'
        with:
          name: relative-investment-preview
          path: |
            .research-backend/artifacts/relative-ews-*/result/preview/
            .research-backend/artifacts/relative-ews-*/result/investment_view.json
          retention-days: 14
