name: Diagnose market health
on:
  workflow_dispatch:
    inputs:
      market:
        type: choice
        options: [kr, us]
        default: kr
      month:
        description: Frozen model month YYYY-MM
        type: string
        default: '2026-09'
      artifact:
        description: Optional collection artifact ID (0 skips inspection)
        type: number
        default: 0
      head:
        description: Model head to inspect without fitting
        type: choice
        options: [all, down, up]
        default: all
      comparison_anchors:
        description: Optional comma-separated common calendar dates for target comparison
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: market-health-diagnosis
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RESEARCH_STORAGE: ${{ vars.RESEARCH_STORAGE }}
      RESEARCH_BACKEND_URL: ${{ vars.RESEARCH_BACKEND_URL }}
      RESEARCH_BACKEND_TOKEN: ${{ secrets.RESEARCH_BACKEND_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      DIAG_MARKET: ${{ inputs.market }}
      DIAG_MONTH: ${{ inputs.month }}
      DIAG_ARTIFACT: ${{ inputs.artifact }}
      DIAG_HEAD: ${{ inputs.head }}
      DIAG_COMPARISON_ANCHORS: ${{ inputs.comparison_anchors }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-live.txt
      - name: Install production numerical packages
        run: python -m pip install -r requirements-live.txt
      - name: Reproduce frozen calibration and inspect optional collection artifact
        run: python scripts/diagnose_market_health.py --market "$DIAG_MARKET" --month "$DIAG_MONTH" --head "$DIAG_HEAD" --artifact "$DIAG_ARTIFACT" --comparison-anchors "$DIAG_COMPARISON_ANCHORS" --output .research-backend/artifacts/market-diagnosis/report.json
      - name: Archive aggregate report outside operational state
        run: python scripts/research_backend_client.py push --project investment --name "market-diagnosis-$DIAG_MARKET-$DIAG_HEAD-$DIAG_MONTH-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --root .research-backend/artifacts/market-diagnosis --paths report.json
      - uses: actions/upload-artifact@v4
        with:
          name: market-diagnosis-${{ inputs.market }}-${{ inputs.head }}-${{ inputs.month }}
          path: .research-backend/artifacts/market-diagnosis/report.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
