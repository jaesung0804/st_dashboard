name: Diagnose market health
on:
  workflow_dispatch:
  push:
    branches: [codex/market-batch-auc-20260911]
    paths: [scripts/diagnose_market_health.py, .github/workflows/diagnose-market-health.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: market-health-diagnosis
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RESEARCH_STORAGE: ${{ vars.RESEARCH_STORAGE }}
      RESEARCH_BACKEND_URL: ${{ vars.RESEARCH_BACKEND_URL }}
      RESEARCH_BACKEND_TOKEN: ${{ secrets.RESEARCH_BACKEND_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-live.txt
      - name: Install production numerical packages
        run: python -m pip install -r requirements-live.txt
      - name: Reproduce frozen Korean calibration and inspect failed US collection
        run: python scripts/diagnose_market_health.py --artifact 10179539328
