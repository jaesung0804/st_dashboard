name: Daily Refresh
run-name: Daily Refresh (${{ inputs.market || 'all' }})
on:
  workflow_dispatch:
    inputs:
      market:
        description: Market to collect and infer
        type: choice
        default: all
        options: [all, kr, us]
      asof:
        description: "Completed session YYYYMMDD; blank uses latest available close"
        type: string
        default: ""
  schedule:
    # After the US close; Korean signals use the already completed Korean session.
    - cron: "30 22 * * 1-5"
  workflow_run:
    workflows: ["Monthly Training"]
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  refresh-and-publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/dashboard-batch.yml
    with:
      mode: infer
      market: ${{ inputs.market || 'all' }}
      asof: ${{ inputs.asof || '' }}
