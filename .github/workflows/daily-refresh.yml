name: Daily Refresh
run-name: Daily Refresh (${{ inputs.market || 'all' }})
on:
  # Explicit one-time post-merge recovery for the September incident. Normal
  # code pushes do not collect prices; the merge message must opt in below.
  push:
    branches: [main]
    paths: [.github/workflows/daily-refresh.yml, scripts/refresh_dashboard_pipeline.py]
  workflow_dispatch:
    inputs:
      market:
        description: Market to collect and infer
        type: choice
        default: all
        options: [all, kr, us]
      asof:
        description: "Completed session YYYYMMDD; blank uses latest available close"
        type: string
        default: ""
  workflow_run:
    workflows: ["Dashboard State Recovery"]
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  kr:
    if: (github.event_name != 'push' || contains(github.event.head_commit.message, '[market-recovery-20260911]')) && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (inputs.market != 'us')
    uses: ./.github/workflows/dashboard-batch.yml
    secrets:
      RESEARCH_BACKEND_TOKEN: ${{ secrets.RESEARCH_BACKEND_TOKEN }}
    with:
      mode: infer
      market: kr
      asof: ${{ inputs.asof || '' }}
  us:
    # Separate restore/save transactions. A failed KR run does not skip US.
    # Serialize manual "all" to avoid competing writes to the shared snapshot.
    needs: kr
    if: always() && !cancelled() && (github.event_name != 'push' || contains(github.event.head_commit.message, '[market-recovery-20260911]')) && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (inputs.market != 'kr')
    uses: ./.github/workflows/dashboard-batch.yml
    secrets:
      RESEARCH_BACKEND_TOKEN: ${{ secrets.RESEARCH_BACKEND_TOKEN }}
    with:
      mode: infer
      market: us
      asof: ${{ inputs.asof || '' }}
