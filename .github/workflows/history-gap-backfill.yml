name: Backfill recommendation history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/history-gap-backfill.yml
      - scripts/backfill_recommendation_history.py
permissions:
  contents: write
  actions: read
concurrency:
  group: dashboard-state-update
  cancel-in-progress: false
jobs:
  backfill-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PAGES_BUILD_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/checkout@v4
        with:
          ref: dashboard-state
          path: app/.dashboard-state
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements-live.txt
      - run: python -m pip install -r requirements-live.txt
      - name: Restore state and fingerprint immutable production records
        run: |
          python scripts/unpack_dashboard_state.py --state-dir .dashboard-state
          python scripts/verify_research_integrity.py before
      - name: Fill only missing observed sessions since August 1
        run: python scripts/backfill_recommendation_history.py --market all --start 2026-08-01
      - name: Verify full archive coverage without replacing original forecasts
        run: |
          python scripts/run_monthly_ews.py export --days 60
          python scripts/verify_research_integrity.py after
      - name: Preserve backfill summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recommendation-history-backfill
          path: app/.work/recommendation-history-backfill.json
          retention-days: 30
      - name: Save retained state atomically
        run: |
          python scripts/pack_dashboard_state.py --state-dir .dashboard-state
          python scripts/push_dashboard_state.py --state-dir .dashboard-state
      - name: Publish completed recommendation history
        run: python scripts/build_pages_deploy.py --days 60 --push
