name: Inspect portfolio feasibility evidence
on:
  push:
    branches: [codex/portfolio-feasibility-audit-20261011]
    paths:
      - scripts/inspect_portfolio_archives.py
      - .github/workflows/portfolio-feasibility-audit.yml
permissions:
  contents: read
concurrency:
  group: portfolio-feasibility-evidence-read
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RESEARCH_BACKEND_URL: ${{ vars.RESEARCH_BACKEND_URL }}
      RESEARCH_BACKEND_TOKEN: ${{ secrets.RESEARCH_BACKEND_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read immutable research archive inventories
        run: python scripts/inspect_portfolio_archives.py
