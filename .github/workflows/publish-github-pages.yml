name: Publish verified GitHub Pages
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily Refresh", "Daily Refresh KR", "Daily Refresh US", "Refresh dashboard UI", "Macro EWS comparison", "Accounting and history research", "Refresh accounting inference", "Backfill recommendation history"]
    types: [completed]
permissions:
  contents: read
  pages: write
concurrency:
  group: dashboard-pages-publication
  cancel-in-progress: false
jobs:
  publish:
    # A manual "all" run can save/publish KR even when US later fails.
    # This job verifies only the already committed gh-pages bundle.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || (github.event.workflow_run.path == '.github/workflows/daily-refresh.yml' && github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # A gh-pages push made with GITHUB_TOKEN does not itself trigger a build.
      - name: Request Pages build and verify published manifests
        uses: actions/github-script@v7
        with:
          script: |
            const {createHash} = require('node:crypto');
            const repo = context.repo;
            const {data: pages} = await github.rest.repos.getPages(repo);
            core.info(`Pages configuration: build=${pages.build_type}, branch=${pages.source?.branch}`);
            if (pages.source?.branch !== 'gh-pages' || pages.build_type === 'workflow') {
              throw new Error('This publisher requires the existing gh-pages branch publishing source. No Pages settings were changed.');
            }
            const {data: ref} = await github.rest.git.getRef({...repo, ref: 'heads/gh-pages'});
            const expectedCommit = ref.object.sha;
            await github.rest.repos.requestPagesBuild(repo);
            let built = false;
            for (let attempt = 0; attempt < 30; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 15000));
              const {data: build} = await github.rest.repos.getLatestPagesBuild(repo);
              if (build.commit !== expectedCommit) continue;
              if (build.status === 'errored') throw new Error(`Pages build failed: ${build.error?.message}`);
              if (build.status === 'built') { built = true; break; }
            }
            if (!built) throw new Error(`Pages build did not finish for ${expectedCommit}`);
            for (const market of ['kr', 'us']) {
              const path = `lgbm_warning_dashboard_macro_${market}_latest/manifest.json`;
              const {data: expected} = await github.rest.repos.getContent({...repo, path, ref: expectedCommit});
              const expectedText = Buffer.from(expected.content, 'base64').toString('utf8');
              const url = new URL(path, pages.html_url.endsWith('/') ? pages.html_url : pages.html_url + '/');
              let observed;
              for (let attempt = 0; attempt < 12; attempt++) {
                url.search = `deployment=${expectedCommit}&attempt=${attempt}`;
                const response = await fetch(url, {cache: 'no-store', signal: AbortSignal.timeout(20000)});
                if (response.ok && await response.text() === expectedText) {
                  observed = JSON.parse(expectedText.replace(/^\uFEFF/, ''));
                  break;
                }
                await new Promise(resolve => setTimeout(resolve, 10000));
              }
              if (!observed) throw new Error(`Published ${market} manifest does not yet match ${expectedCommit}`);
              core.info(`Published ${market}: latest=${observed.latest}, models=${JSON.stringify(observed.models)}`);
              const checks = {...(observed.uiAssets || {})};
              const contextHash = observed.priceContext?.sha256ByDate?.[observed.latest];
              if (contextHash) checks[`price_context/${observed.latest}.json`] = contextHash;
              for (const [file, expectedHash] of Object.entries(checks)) {
                const assetUrl = new URL(`lgbm_warning_dashboard_macro_${market}_latest/${file}`, pages.html_url.endsWith('/') ? pages.html_url : pages.html_url + '/');
                let verified = false;
                for (let attempt = 0; attempt < 6; attempt++) {
                  assetUrl.search = `deployment=${expectedCommit}&attempt=${attempt}`;
                  const response = await fetch(assetUrl, {cache: 'no-store', signal: AbortSignal.timeout(20000)});
                  if (response.ok) {
                    const body = Buffer.from(await response.arrayBuffer());
                    if (createHash('sha256').update(body).digest('hex') === expectedHash) { verified = true; break; }
                  }
                  await new Promise(resolve => setTimeout(resolve, 5000));
                }
                if (!verified) throw new Error(`Published asset mismatch: ${market}/${file}`);
              }
              core.info(`Verified ${market} public UI and price lookup: ${Object.keys(checks).length} files, UI=${observed.uiVersion || 'legacy'}`);
            }
            core.info(`Verified public Pages deployment: ${pages.html_url} at ${expectedCommit}`);
