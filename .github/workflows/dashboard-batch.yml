name: Dashboard batch
on:
  workflow_call:
    secrets:
      RESEARCH_BACKEND_TOKEN:
        required: false
    inputs:
      mode:
        required: true
        type: string
      market:
        required: true
        type: string
      asof:
        type: string
        default: ""
permissions:
  contents: write
  actions: read
concurrency:
  group: dashboard-state-update
  queue: max
  cancel-in-progress: false
env:
  RESEARCH_STORAGE: ${{ vars.RESEARCH_STORAGE || 'git' }}
  RESEARCH_BACKEND_URL: ${{ vars.RESEARCH_BACKEND_URL }}
  RESEARCH_BACKEND_TOKEN: ${{ secrets.RESEARCH_BACKEND_TOKEN }}
jobs:
  batch:
    runs-on: windows-latest
    timeout-minutes: ${{ inputs.mode == 'train' && 330 || 150 }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      BATCH_MARKET: ${{ inputs.market }}
      BATCH_ASOF: ${{ inputs.asof }}
    defaults:
      run:
        shell: pwsh
        working-directory: app
    steps:
      - name: Require an isolated market transaction
        working-directory: .
        run: |
          if ($env:BATCH_MARKET -notin @('kr', 'us')) { throw 'Run a separate batch for each market' }
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: app
      - name: Checkout dashboard state
        uses: actions/checkout@v4
        if: vars.RESEARCH_STORAGE != 'backend'
        with:
          ref: dashboard-state
          path: app/.dashboard-state
      - name: Checkout published prediction history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: app/.legacy-pages
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-live.txt
      - name: Install dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -r requirements-live.txt
          python -m pip install -e .
      - name: Restore dashboard state
        run: python scripts/unpack_dashboard_state.py --state-dir .dashboard-state
      - name: Restore resumable price checkpoints
        if: inputs.market == 'kr'
        uses: actions/cache/restore@v4
        with:
          path: app/data/cache/krx_ranges
          key: krx-range-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            krx-range-v1-${{ runner.os }}-
      - name: Preserve published prediction history
        run: python scripts/run_monthly_ews.py migrate --legacy-pages .legacy-pages
      - name: Collect prices for monthly training
        if: inputs.mode == 'train'
        timeout-minutes: 120
        run: |
          $argsList = @("scripts/refresh_dashboard_pipeline.py", "--market", $env:BATCH_MARKET, "--collect-only")
          if ($env:BATCH_ASOF) { $argsList += @("--asof", $env:BATCH_ASOF) }
          python @argsList
      - name: Collect prices and infer with frozen models
        if: inputs.mode == 'infer'
        timeout-minutes: 120
        run: |
          $argsList = @("scripts/refresh_dashboard_pipeline.py", "--market", $env:BATCH_MARKET, "--skip-push")
          if ($env:BATCH_ASOF) { $argsList += @("--asof", $env:BATCH_ASOF) }
          python @argsList
      - name: Save resumable price checkpoints
        if: always() && inputs.market == 'kr'
        uses: actions/cache/save@v4
        with:
          path: app/data/cache/krx_ranges
          key: krx-range-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Preserve collection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-collection-${{ inputs.market }}-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/outputs/daily/**/krx*refresh_summary.csv
            app/outputs/daily/**/krx_collection.json
            app/outputs/daily/**/us_daily_data_refresh_summary.csv
            app/outputs/daily/**/us_collection.json
            app/data/cache/krx_ranges
          if-no-files-found: ignore
          retention-days: 7
      - name: Train and freeze this month's models
        if: inputs.mode == 'train'
        run: python scripts/run_monthly_ews.py train --market $env:BATCH_MARKET --jobs 1
      - name: Evaluate matured live forecasts separately
        if: inputs.mode == 'train'
        run: python scripts/run_monthly_ews.py evaluate --market $env:BATCH_MARKET
      - name: Validate signal dates and archived predictions
        if: inputs.mode == 'infer'
        run: python scripts/validate_live_dashboard.py --market $env:BATCH_MARKET --asof "$env:BATCH_ASOF"
      - name: Pack dashboard state
        run: python scripts/pack_dashboard_state.py --state-dir .dashboard-state
      - name: Create recovery artifact
        if: vars.RESEARCH_STORAGE != 'backend'
        run: |
          $items = Get-ChildItem .dashboard-state -Force | Where-Object { $_.Name -ne ".git" }
          Compress-Archive -Path $items.FullName -DestinationPath dashboard-state-backup.zip -Force
      - name: Upload recovery artifact
        if: vars.RESEARCH_STORAGE != 'backend'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-state-${{ inputs.market }}-${{ inputs.mode }}-${{ github.run_id }}
          path: app/dashboard-state-backup.zip
          retention-days: 7
      - name: Persist models and predictions before publishing
        run: python scripts/push_dashboard_state.py --state-dir .dashboard-state
      - name: Publish GitHub Pages
        if: inputs.mode == 'infer'
        run: python scripts/build_pages_deploy.py --days 60 --push
      - name: Queue changed monthly observations from the saved snapshot
        id: row_projection
        if: vars.RESEARCH_STORAGE == 'backend'
        # SQL projection is secondary to the verified canonical snapshot.
        # Surface its failure without discarding a saved, publishable forecast.
        continue-on-error: true
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:BATCH_MARKET -eq 'kr') {
            python scripts/backend_rows.py --csv data/raw/krx_ohlcv_kospi_kosdaq_state.csv --dataset ohlcv-kr --snapshot-name pipeline-state --state-dir .dashboard-state
          } else {
            python scripts/backend_rows.py --csv data/raw/us_ohlcv_nasdaq_nyse_yfinfo_state.csv --dataset ohlcv-us --snapshot-name pipeline-state --state-dir .dashboard-state
          }
      - name: Report deferred SQL projection
        if: always() && steps.row_projection.outcome == 'failure'
        run: |
          $message = "$env:BATCH_MARKET SQL projection queue failed. The verified pipeline-state snapshot remains canonical; inspect this step before resuming row import."
          Write-Warning $message
          $message | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
