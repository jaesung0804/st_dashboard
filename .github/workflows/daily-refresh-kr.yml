name: Daily Refresh KR
on:
  workflow_dispatch:
    inputs:
      asof:
        description: "Completed session YYYYMMDD; blank uses latest available close"
        type: string
        default: ""
  # Scheduled daily collection paused on 2026-11-11.
  # Keep workflow_dispatch available for explicitly requested manual runs.
permissions:
  contents: write
  actions: read
jobs:
  refresh:
    uses: ./.github/workflows/dashboard-batch.yml
    secrets:
      RESEARCH_BACKEND_TOKEN: ${{ secrets.RESEARCH_BACKEND_TOKEN }}
    with:
      mode: infer
      market: kr
      asof: ${{ inputs.asof || '' }}
