name: Validate research backend integration
on:
  pull_request:
    paths: ['scripts/**', 'tests/**', '.github/workflows/**']
  push:
    branches: [main, 'codex/**']
    paths: ['scripts/**', 'tests/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-backend-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      RESEARCH_STORAGE: git
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal test dependencies
        run: python -m pip install pytest requests 'pytest-socket==0.7.0'
      - name: Check saved state and atomic research updates without cloud access
        run: >-
          python -m pytest -q --disable-socket
          tests/test_backend_rows.py
          tests/test_backend_references.py
          tests/test_dashboard_state.py
          tests/test_state_publish_recovery.py
          tests/test_shadow_state_archive.py
