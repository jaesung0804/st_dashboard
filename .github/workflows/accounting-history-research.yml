name: Accounting and history research
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: dashboard-state-update
  queue: max
  cancel-in-progress: false
env:
  RESEARCH_STORAGE: ${{ vars.RESEARCH_STORAGE || 'git' }}
  RESEARCH_BACKEND_URL: ${{ vars.RESEARCH_BACKEND_URL }}
  RESEARCH_BACKEND_TOKEN: ${{ secrets.RESEARCH_BACKEND_TOKEN }}
jobs:
  compare-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    defaults:
      run:
        working-directory: app
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PAGES_BUILD_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/checkout@v4
        if: vars.RESEARCH_STORAGE != 'backend'
        with:
          ref: dashboard-state
          path: app/.dashboard-state
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements-live.txt
      - run: python -m pip install -r requirements-live.txt
      - name: Restore and fingerprint production records
        run: |
          python scripts/unpack_dashboard_state.py --state-dir .dashboard-state
          python scripts/verify_research_integrity.py before
      - name: Restore verified receipt-dated event snapshot
        run: python scripts/restore_accounting_seed.py
      - name: Reconstruct isolated August and September records
        run: |
          python scripts/reconstruct_market_history.py --market kr
          python scripts/reconstruct_market_history.py --market us
          python scripts/analyze_market_reconstruction.py
      - name: Compare price macro and accounting inputs
        run: |
          python scripts/run_accounting_comparison.py --market kr --prepared
          python scripts/run_accounting_comparison.py --market us --prepared
      - name: Verify frozen production and reconstructed coverage
        run: |
          python scripts/run_monthly_ews.py export --days 60
          python scripts/verify_research_integrity.py after
      - name: Preserve research recovery bundle
        if: always() && vars.RESEARCH_STORAGE != 'backend'
        uses: actions/upload-artifact@v4
        with:
          name: accounting-history-research
          path: app/data/dashboard_research
          retention-days: 30
      - name: Save all retained data atomically
        run: |
          python scripts/pack_dashboard_state.py --state-dir .dashboard-state
          python scripts/push_dashboard_state.py --state-dir .dashboard-state
      - name: Queue changed monthly observations from the saved snapshot
        if: vars.RESEARCH_STORAGE == 'backend'
        run: |
          python scripts/backend_rows.py --csv data/raw/krx_ohlcv_kospi_kosdaq_state.csv --dataset ohlcv-kr --snapshot-name pipeline-state --state-dir .dashboard-state
          python scripts/backend_rows.py --csv data/raw/us_ohlcv_nasdaq_nyse_yfinfo_state.csv --dataset ohlcv-us --snapshot-name pipeline-state --state-dir .dashboard-state
      - name: Publish research and complete date history
        run: python scripts/build_pages_deploy.py --days 60 --push
