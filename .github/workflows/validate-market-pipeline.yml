name: Validate market pipeline
on:
  pull_request:
    paths: ['src/ai_stock_assistant/monthly_ews.py', 'src/ai_stock_assistant/relative_ews.py', 'src/ai_stock_assistant/asymmetric_ews.py', 'src/ai_stock_assistant/data/**', 'scripts/run_relative_ews_research.py', 'scripts/run_asymmetric_ews_research.py', 'scripts/export_investment_experiment.py', 'data/reference/relative_ews_release.json', 'scripts/build_investment_preview.py', 'scripts/build_investment_metrics.py', 'scripts/enrich_investment_view.py', 'scripts/refresh_dashboard_pipeline.py', 'scripts/build_pages_deploy.py', 'scripts/ensure_pages_build.cjs', 'scripts/build_price_context.py', 'scripts/dashboard_web/**', 'scripts/simulation_web/**', '.gitattributes', 'tests/**', '.github/workflows/**']
  push:
    branches: [main, 'codex/**']
    paths: ['src/ai_stock_assistant/monthly_ews.py', 'src/ai_stock_assistant/relative_ews.py', 'src/ai_stock_assistant/asymmetric_ews.py', 'src/ai_stock_assistant/data/**', 'scripts/run_relative_ews_research.py', 'scripts/run_asymmetric_ews_research.py', 'scripts/export_investment_experiment.py', 'data/reference/relative_ews_release.json', 'scripts/build_investment_preview.py', 'scripts/build_investment_metrics.py', 'scripts/enrich_investment_view.py', 'scripts/refresh_dashboard_pipeline.py', 'scripts/build_pages_deploy.py', 'scripts/ensure_pages_build.cjs', 'scripts/build_price_context.py', 'scripts/dashboard_web/**', 'scripts/simulation_web/**', '.gitattributes', 'tests/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RESEARCH_STORAGE: git
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-live.txt
      - run: python -m pip install -r requirements-live.txt pytest 'pytest-socket==0.7.0'
      - name: Verify coverage, corporate-action isolation, and dated model diagnostics
        run: python -m pytest -q --disable-socket tests/test_krx_incremental.py tests/test_us_incremental.py tests/test_monthly_ews.py tests/test_relative_ews.py tests/test_asymmetric_ews.py tests/test_investment_export.py tests/test_investment_metrics.py tests/test_replay_checkout.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify explorer state, frozen forecasts, and generated UI assets
        run: |
          node tests/test_dashboard_ui.cjs
          node tests/test_pages_build.cjs
          node tests/test_investment_ui.cjs
          node --check scripts/dashboard_web/investment.js
          python -m pytest -q --disable-socket tests/test_build_pages_deploy.py tests/test_price_context.py tests/test_financial_database.py tests/test_investment_export.py tests/test_investment_metrics.py
