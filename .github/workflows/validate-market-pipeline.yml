name: Validate market pipeline
on:
  pull_request:
    paths: ['src/ai_stock_assistant/monthly_ews.py', 'src/ai_stock_assistant/data/**', 'scripts/refresh_dashboard_pipeline.py', '.gitattributes', 'tests/**', '.github/workflows/**']
  push:
    branches: [main, 'codex/**']
    paths: ['src/ai_stock_assistant/monthly_ews.py', 'src/ai_stock_assistant/data/**', 'scripts/refresh_dashboard_pipeline.py', '.gitattributes', 'tests/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RESEARCH_STORAGE: git
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-live.txt
      - run: python -m pip install -r requirements-live.txt pytest 'pytest-socket==0.7.0'
      - name: Verify coverage, corporate-action isolation, and dated model diagnostics
        run: python -m pytest -q --disable-socket tests/test_us_incremental.py tests/test_monthly_ews.py tests/test_replay_checkout.py
