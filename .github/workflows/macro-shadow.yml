name: Macro EWS comparison
run-name: Macro EWS comparison (${{ inputs.mode || (github.event_name == 'workflow_run' && 'infer' || 'train') }})
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Monthly training or inference with already frozen models
        type: choice
        default: infer
        options: [infer, train]
  schedule:
    - cron: "45 4 1 * *"
  workflow_run:
    # Run after Daily Refresh rather than competing with it after Monthly Training.
    workflows: [Daily Refresh, Daily Refresh KR, Daily Refresh US]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: dashboard-state-update
  queue: max
  cancel-in-progress: false
env:
  RESEARCH_STORAGE: ${{ vars.RESEARCH_STORAGE || 'git' }}
  RESEARCH_BACKEND_URL: ${{ vars.RESEARCH_BACKEND_URL }}
  RESEARCH_BACKEND_TOKEN: ${{ secrets.RESEARCH_BACKEND_TOKEN }}
jobs:
  compare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # Match the working production data-collection environment. The first Linux
    # request for the large historical archive timed out before response headers.
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PAGES_BUILD_VERSION: ${{ github.sha }}
      SHADOW_MODE: ${{ inputs.mode || (github.event_name == 'workflow_run' && 'infer' || 'train') }}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: app
      - name: Checkout dashboard state
        uses: actions/checkout@v4
        if: vars.RESEARCH_STORAGE != 'backend'
        with:
          ref: dashboard-state
          path: app/.dashboard-state
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-live.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-live.txt
      - name: Restore verified state
        run: python scripts/unpack_dashboard_state.py --state-dir .dashboard-state
      - name: Record production model and forecast checksums
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          hashes={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('data/dashboard_ews').rglob('*') if p.is_file()}
          Path('production-before.json').write_text(json.dumps(hashes))
          PY
      - name: Collect missing official monthly macro vintages
        timeout-minutes: 10
        run: python scripts/run_shadow_ews.py collect
      - name: Check access to a small official monthly file
        if: github.event_name == 'push'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'src')
          from ai_stock_assistant.data import macro_vintages as m
          body=m.download(m.BASE+'monthly/2026-07-md.csv',2_000_000)
          row=m.vintage_features(body,'2026-07',m.SOURCE)
          print(f"Small official monthly download verified: {len(body)} bytes, source SHA256 {row['source_sha256']}")
          PY
      - name: Train paired monthly models and temporal holdouts
        if: env.SHADOW_MODE == 'train'
        timeout-minutes: 55
        run: python -u scripts/run_shadow_ews.py train
      - name: Check fixed models are ready
        id: ready
        run: |
          python - <<'PY'
          import os
          import sys
          from datetime import datetime,timezone
          from pathlib import Path
          sys.path.insert(0,'src')
          from ai_stock_assistant.shadow_ews import market_root
          month=datetime.now(timezone.utc).strftime('%Y-%m')
          missing=[f'{m}/{a}' for m in ['kr','us'] for a in ['price','macro'] if not (market_root(Path('data/dashboard_ews_shadow'),m)/'models'/month/a/'model.json').exists()]
          ready=not missing
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f"ready={str(ready).lower()}\n")
          if missing:
              message=f'Waiting for monthly shadow models {month}: {missing}. Daily inference never trains; monthly training runs at 04:45 UTC on day 1.'
              print(message)
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write(message+'\n')
          PY
      - name: Infer paired scores and evaluate matured saved forecasts
        if: steps.ready.outputs.ready == 'true'
        run: python -u scripts/run_shadow_ews.py infer
      - name: Verify production state remains byte-identical
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          before=json.loads(Path('production-before.json').read_text())
          after={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('data/dashboard_ews').rglob('*') if p.is_file()}
          assert before==after, 'Production state changed during shadow comparison'
          print(f'Production state unchanged: {len(before)} files')
          PY
      - name: Pack complete state including independent experiment
        if: steps.ready.outputs.ready == 'true' || vars.RESEARCH_STORAGE == 'backend'
        # Keep the growing experiment in a bounded compressed archive.
        # Backend runs retain collected vintages even while monthly models wait.
        run: python scripts/pack_dashboard_state.py --state-dir .dashboard-state
      - name: Retain experiment recovery artifact
        if: always() && vars.RESEARCH_STORAGE != 'backend'
        uses: actions/upload-artifact@v4
        with:
          name: macro-comparison-${{ github.run_id }}
          path: app/data/dashboard_ews_shadow
          if-no-files-found: ignore
          retention-days: 7
      - name: Persist verified state before publishing
        if: steps.ready.outputs.ready == 'true' || vars.RESEARCH_STORAGE == 'backend'
        run: python scripts/push_dashboard_state.py --state-dir .dashboard-state
      - name: Queue changed monthly observations from the saved snapshot
        if: vars.RESEARCH_STORAGE == 'backend'
        run: |
          python scripts/backend_rows.py --csv data/raw/krx_ohlcv_kospi_kosdaq_state.csv --dataset ohlcv-kr --snapshot-name pipeline-state --state-dir .dashboard-state
          python scripts/backend_rows.py --csv data/raw/us_ohlcv_nasdaq_nyse_yfinfo_state.csv --dataset ohlcv-us --snapshot-name pipeline-state --state-dir .dashboard-state
      - name: Export unchanged operational forecasts
        if: steps.ready.outputs.ready == 'true'
        run: python scripts/run_monthly_ews.py export --days 60
      - name: Publish recommendation UI and separate model comparison
        if: steps.ready.outputs.ready == 'true'
        run: python scripts/build_pages_deploy.py --days 60 --push
