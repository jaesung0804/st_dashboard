name: Monthly Training
# Training runs only on its monthly schedule or an explicit dispatch.
run-name: Monthly Training (${{ inputs.market || 'all' }})
on:
  workflow_dispatch:
    inputs:
      market:
        description: Market to train (an existing monthly model is kept)
        type: choice
        default: all
        options: [all, kr, us]
  schedule:
    # Previous calendar month has closed in both markets.
    - cron: "30 0 1 * *"
permissions:
  contents: write
  actions: read
jobs:
  train:
    uses: ./.github/workflows/dashboard-batch.yml
    secrets:
      RESEARCH_BACKEND_TOKEN: ${{ secrets.RESEARCH_BACKEND_TOKEN }}
    with:
      mode: train
      market: ${{ inputs.market || 'all' }}
