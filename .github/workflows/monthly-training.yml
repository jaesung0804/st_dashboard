name: Monthly Training
# Retry with resumable prices and explicit handling of unavailable intraday OHLC.
# This workflow change starts training on the corrected commit; an Actions rerun
# of an older run would still execute its old validation code.
run-name: Monthly Training (${{ inputs.market || 'all' }})
on:
  workflow_dispatch:
    inputs:
      market:
        description: Market to train (an existing monthly model is kept)
        type: choice
        default: all
        options: [all, kr, us]
  schedule:
    # Previous calendar month has closed in both markets.
    - cron: "30 0 1 * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/monthly-training.yml
permissions:
  contents: write
  actions: read
jobs:
  train:
    uses: ./.github/workflows/dashboard-batch.yml
    with:
      mode: train
      market: ${{ inputs.market || 'all' }}
