name: Collect dated financial statements
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bootstrap, refresh a current batch, or repair all saved metrics from retained sources
        type: choice
        options: [refresh, bootstrap, repair]
        default: refresh
      market:
        type: choice
        options: [all, kr, us]
        default: all
      limit:
        description: Maximum companies per market for a refresh
        type: number
        default: 600
      tickers:
        description: Optional space-separated tickers for an explicit repair
        type: string
        default: ''
  schedule:
    - cron: '20 2 * * *'
      timezone: Asia/Seoul
permissions:
  contents: write
concurrency:
  group: dashboard-state-update
  queue: max
  cancel-in-progress: false
env:
  RESEARCH_STORAGE: ${{ vars.RESEARCH_STORAGE }}
  RESEARCH_BACKEND_URL: ${{ vars.RESEARCH_BACKEND_URL }}
  RESEARCH_BACKEND_TOKEN: ${{ secrets.RESEARCH_BACKEND_TOKEN }}
jobs:
  financial-database:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: '1'
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      FIN_MODE: ${{ inputs.mode || 'refresh' }}
      FIN_MARKET: ${{ inputs.market || 'all' }}
      FIN_LIMIT: ${{ inputs.limit || 600 }}
      FIN_TICKERS: ${{ inputs.tickers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-live.txt
      - run: python -m pip install -r requirements-live.txt
      - name: Restore verified financial inputs, write Oracle statements, then save derived metrics
        run: |
          python - <<'PY'
          import os, subprocess, sys
          args = [sys.executable, 'scripts/financial_database.py', os.environ['FIN_MODE'],
                  '--market', os.environ['FIN_MARKET'], '--limit', os.environ['FIN_LIMIT']]
          tickers = os.environ.get('FIN_TICKERS', '').split()
          if tickers:
              args += ['--tickers', *tickers]
          subprocess.run(args, check=True)
          PY
      - name: Publish saved financial metrics without collecting prices or training
        run: python scripts/publish_financial_dashboard.py
