<script>
(() => {
  const target = new URL(@@TARGET_JSON@@, location.href);
  const previous = new URLSearchParams(location.search);
  const query = previous.get('q') || previous.get('ticker');
  if (query) target.searchParams.set('q', query.slice(0, 100));
  location.replace(target.href);
})();
</script><noscript><meta http-equiv="refresh" content="0;url=@@TARGET_HTML@@"></noscript></head>
